    text: '  "price_sources": {'
    section: AWS price sources
  - source_id: production
    text: "## SLA (stated assumptions, arithmetic shown)\nAssume avg file ~1 MiB, mixed formats, batch arrival,\
      \ 200 concurrent 1-vCPU\nworkers at ~20 MB/s each → ~4 GB/s aggregate ideal.\n- **1 TB**: ideal transform\
      \ ≈ 250 s (~4.2 min); with the verify re-read (~2x\n  IO), queueing, stragglers, and retries, target **verified-published\
      \ ≤ 1\n  hour** — overhead-dominated, not throughput-dominated.\n- **1 PB**: ideal transform ≈ 250,000 s (~2.9\
      \ days) at the same pool; target\n  **≤ 7 days**, or scale the pool (2,000 workers → ideal ≈ 7 h, target ≤\
      \ 1 day).\n  Throughput scales linearly until S3 request rates / account quotas bind.\nFail-closed guarantee\
      \ unchanged: nothing unverified is ever released.\n\n## Cost (reproducible)\nRun: `python scripts/estimate_aws_cost.py\
      \ --inputs costs/aws-us-east-1-inputs.json`.\nWith the committed us-east-1 list-price inputs (price_date 2026-09-04):\n\
      - **1 TB ≈ $86** (storage-dominant), **1 PB ≈ $85,734** (storage-dominant), including staging storage, verify\
      \ rereads, promote requests, a 2% retry fraction, and explicit per-object SQS/EventBridge/KMS/CloudWatch line\
      \ items. Transfer, tier, and quota assumptions are stated in the committed inputs file.\n- Sensitivity: halving\
      \ throughput barely moves total (storage-bound); a 10×\n  smaller avg file size raises the request term sharply\
      \ — see\n  `costs/example-estimates.json`.\n- Prices are **list prices, not yet confirmed against a dated\
      \ screenshot** —\n  treat as illustrative until verified.\n\n"
    section: SLA and Cost
  notes: 'Project-agent source review, not human presentation approval. Runtime/source candidate 0795dc66deaa5991cd34959c6d8b81f80a8042a0.
    Evidence command: python scripts/estimate_aws_cost.py --inputs costs/aws-us-east-1-inputs.json'
