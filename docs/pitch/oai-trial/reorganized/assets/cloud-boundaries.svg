<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 550" role="img" aria-labelledby="title desc"><title id="title">Proposed AWS trust and publication boundaries</title><desc id="desc">Authored static illustration. Not a screenshot or newly executed result. Source and qualifiers are recorded in the asset manifest.</desc><rect width="1400" height="550" fill="#0c0908" /><defs><marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#e2ac62" /></marker><marker id="failure-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#d1703c" /></marker></defs><rect x="20" y="48" width="950" height="250" rx="10" fill="none" stroke="#a99787" stroke-width="2" stroke-dasharray="8 6" /><text x="495" y="86" fill="#a99787" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="495" dy="0">Private intake / work boundary</tspan></text><rect x="45" y="125" width="250" height="125" rx="10" fill="#181211" stroke="#e2ac62" stroke-width="2" id="intake" data-component="flow-stage-0" class="oai-stage-0" /><text x="170" y="175" fill="#e2ac62" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="170" dy="0">S3 intake</tspan></text><text x="170" y="220" fill="#ece2d3" font-size="27" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="170" dy="0">read-only versions</tspan></text><rect x="325" y="125" width="340" height="125" rx="10" fill="#181211" stroke="#e2ac62" stroke-width="2" id="workers" data-component="flow-stage-1" class="oai-stage-1" /><text x="495" y="175" fill="#e2ac62" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="495" dy="0">Dispatch + workers</tspan></text><text x="495" y="220" fill="#ece2d3" font-size="27" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="495" dy="0">format-aware work</tspan></text><rect x="695" y="125" width="250" height="125" rx="10" fill="#181211" stroke="#e2ac62" stroke-width="2" id="verify" data-component="flow-stage-2" class="oai-stage-2" /><text x="820" y="175" fill="#e2ac62" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="820" dy="0">Verify all</tspan></text><text x="820" y="220" fill="#ece2d3" font-size="27" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="820" dy="0">corpus fan-in</tspan></text><rect x="1020" y="125" width="355" height="125" rx="10" fill="#181211" stroke="#93a289" stroke-width="2" id="publish" data-component="flow-stage-3" class="oai-stage-3" /><text x="1197.5" y="175" fill="#93a289" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="1197.5" dy="0">Publish manifest</tspan></text><text x="1197.5" y="220" fill="#ece2d3" font-size="27" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="1197.5" dy="0">switch active pointer</tspan></text><rect x="660" y="369" width="320" height="105" rx="10" fill="#181211" stroke="#d1703c" stroke-width="2" id="quarantine" data-component="quarantine" /><text x="820" y="419" fill="#d1703c" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="820" dy="0">Quarantine</tspan></text><text x="332.5" y="323" fill="#e2ac62" font-size="26" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="332.5" dy="0">retry / replay</tspan></text><text x="1197.5" y="367" fill="#a99787" font-size="29" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="1197.5" dy="0">Durable publication</tspan><tspan x="1197.5" dy="36.54">boundary</tspan></text><text x="40" y="523" fill="#a99787" font-size="26" font-family="Arial, sans-serif" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">DESIGN ONLY · one versioned identity / collision plan for every worker</tspan></text><path d="M 299 187.5 H 319" fill="none" stroke="#e2ac62" stroke-width="3" marker-end="url(#flow-arrow)" class="oai-edge-0" /><path d="M 669 187.5 H 689" fill="none" stroke="#e2ac62" stroke-width="3" marker-end="url(#flow-arrow)" class="oai-edge-1" /><path d="M 949 187.5 H 1014" fill="none" stroke="#e2ac62" stroke-width="3" marker-end="url(#flow-arrow)" class="oai-edge-2" /><path d="M 820.0 254 V 363" fill="none" stroke="#d1703c" stroke-width="3" marker-end="url(#failure-arrow)" /><path d="M 495.0 254 V 331 H 170.0 V 256" fill="none" stroke="#e2ac62" stroke-width="3" marker-end="url(#flow-arrow)" /><line x1="990" x2="990" y1="50" y2="475" stroke="#e2ac62" stroke-width="2" stroke-dasharray="8 6" /><style>@media (prefers-reduced-motion: no-preference){@keyframes oai-stage-0{0%,0%{stroke-width:2}4%,12%{stroke-width:5}16%,100%{stroke-width:2}} .oai-stage-0{animation:oai-stage-0 12s linear infinite}@keyframes oai-stage-1{0%,20%{stroke-width:2}24%,32%{stroke-width:5}36%,100%{stroke-width:2}} .oai-stage-1{animation:oai-stage-1 12s linear infinite}@keyframes oai-stage-2{0%,40%{stroke-width:2}44%,52%{stroke-width:5}56%,100%{stroke-width:2}} .oai-stage-2{animation:oai-stage-2 12s linear infinite}@keyframes oai-stage-3{0%,60%{stroke-width:2}64%,72%{stroke-width:5}76%,100%{stroke-width:2}} .oai-stage-3{animation:oai-stage-3 12s linear infinite}@keyframes oai-edge-0{0%,3%{stroke-opacity:.25}20%,100%{stroke-opacity:1}} .oai-edge-0{animation:oai-edge-0 12s linear infinite}@keyframes oai-edge-1{0%,23%{stroke-opacity:.25}40%,100%{stroke-opacity:1}} .oai-edge-1{animation:oai-edge-1 12s linear infinite}@keyframes oai-edge-2{0%,43%{stroke-opacity:.25}60%,100%{stroke-opacity:1}} .oai-edge-2{animation:oai-edge-2 12s linear infinite}}</style></svg>