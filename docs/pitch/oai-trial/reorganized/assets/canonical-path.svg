<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-labelledby="title desc"><title id="title">Canonical path before and after the fix</title><desc id="desc">Authored static illustration. Not a screenshot or newly executed result. Source and qualifiers are recorded in the asset manifest.</desc><rect width="1400" height="490" fill="#0c0908" /><rect x="20" y="64" width="630" height="278" rx="10" fill="#181211" stroke="#d1703c" stroke-width="2" /><text x="335.0" y="114" fill="#d1703c" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="335.0" dy="0">BEFORE — two path interpretations</tspan></text><text x="54" y="166" fill="#ece2d3" font-size="30" font-family="Consolas, Courier New, monospace" text-anchor="start" font-weight="normal"><tspan x="54" dy="0">release/corpus + review.json</tspan><tspan x="54" dy="37.8">lexical parents miss release/</tspan></text><rect x="750" y="64" width="630" height="278" rx="10" fill="#181211" stroke="#93a289" stroke-width="2" /><text x="1065.0" y="114" fill="#93a289" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="1065.0" dy="0">AFTER — one validated destination</tspan></text><text x="785" y="164" fill="#ece2d3" font-size="29" font-family="Consolas, Courier New, monospace" text-anchor="start" font-weight="normal"><tspan x="785" dy="0">output.resolve()</tspan><tspan x="785" dy="36.54">out.parents → release boundary</tspan><tspan x="785" dy="36.54">write the returned Path</tspan></text><line x1="665" y1="210" x2="736" y2="210" stroke="#e2ac62" stroke-width="3" /><polygon points="736,210 725.1946347717678,215.21958640933477 725.1946347717678,204.78041359066523" fill="#e2ac62" /><text x="35" y="408" fill="#a99787" font-size="29" font-family="Arial, sans-serif" text-anchor="start" font-weight="normal"><tspan x="35" dy="0">Policy and sibling approval receipt are checked before either write.</tspan></text></svg>
