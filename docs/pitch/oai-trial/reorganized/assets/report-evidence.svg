<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Runtime and separate qualification evidence</title><desc id="diagram-description">Runtime transforms, verifies and publishes. A separate qualification harness reads published fixture outputs afterward; it is not a runtime publication gate.</desc><rect width="1400" height="760" fill="#0c0908" /><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e2ac62" /></marker></defs>
<text x="700" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ece2d3">Evidence boundaries</text>
<rect x="80" y="130" width="1240" height="100" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-0" data-component="flow-stage-0" />
<text x="700.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3">Transform</text>
<text x="700.0" y="186" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#ece2d3">Declared replacements</text>
<rect x="80" y="260" width="1240" height="100" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-1" data-component="flow-stage-1" />
<text x="700.0" y="288" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3">Runtime verifier</text>
<text x="700.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#ece2d3">Fresh contract checks</text>
<rect x="80" y="390" width="1240" height="100" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-2" data-component="flow-stage-2" />
<text x="700.0" y="418" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3">Publish</text>
<text x="700.0" y="446" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#ece2d3">report.json last</text>
<rect x="80" y="520" width="1240" height="100" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-3" data-component="flow-stage-3" />
<text x="700.0" y="548" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3">Separate fixture readback</text>
<text x="700.0" y="576" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#ece2d3">Known-fixture outputs</text>
<line x1="700" y1="234.0" x2="700" y2="254.0" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" class="oai-edge-0" />
<line x1="700" y1="364.0" x2="700" y2="384.0" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" class="oai-edge-1" />
<line x1="700" y1="494.0" x2="700" y2="514.0" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="6 4" class="oai-edge-2" />
<text x="700" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ece2d3">Not general privacy approval</text>
<text x="740" y="510" fill="#a99787" font-family="Arial, sans-serif" font-size="17">Qualification only</text><style>@media (prefers-reduced-motion: no-preference){@keyframes oai-stage-0{0%,0%{stroke-width:2}4%,12%{stroke-width:5}16%,100%{stroke-width:2}} .oai-stage-0{animation:oai-stage-0 12s linear infinite}@keyframes oai-stage-1{0%,20%{stroke-width:2}24%,32%{stroke-width:5}36%,100%{stroke-width:2}} .oai-stage-1{animation:oai-stage-1 12s linear infinite}@keyframes oai-stage-2{0%,40%{stroke-width:2}44%,52%{stroke-width:5}56%,100%{stroke-width:2}} .oai-stage-2{animation:oai-stage-2 12s linear infinite}@keyframes oai-stage-3{0%,65%{stroke-width:2}69%,77%{stroke-width:5}81%,100%{stroke-width:2}} .oai-stage-3{animation:oai-stage-3 12s linear infinite}@keyframes oai-edge-0{0%,3%{stroke-opacity:.25}20%,100%{stroke-opacity:1}} .oai-edge-0{animation:oai-edge-0 12s linear infinite}@keyframes oai-edge-1{0%,23%{stroke-opacity:.25}40%,100%{stroke-opacity:1}} .oai-edge-1{animation:oai-edge-1 12s linear infinite}@keyframes oai-edge-2{0%,43%{stroke-opacity:.25}65%,100%{stroke-opacity:1}} .oai-edge-2{animation:oai-edge-2 12s linear infinite}}</style></svg>