<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<text x="700" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#111">Evidence Layers and Their Limits</text>
<text x="700" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#111">Each layer answers a narrower question; none should be promoted into a broader privacy claim.</text>
<rect x="80" y="130" width="1240" height="100" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="700.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">1. Transform</text>
<text x="700.0" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Did the policy-declared replacements run?</text>
<text x="700.0" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Code: formats.py + matcher.py</text>
<rect x="80" y="260" width="1240" height="100" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="700.0" y="288" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">2. Runtime verifier</text>
<text x="700.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Did fresh rereads satisfy the contract?</text>
<text x="700.0" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Shares matcher and pseudonym primitives</text>
<rect x="80" y="390" width="1240" height="100" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="700.0" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">3. Independent fixture readback</text>
<text x="700.0" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Did known synthetic outputs match expected values and schema?</text>
<text x="700.0" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Code: qualify_submission.py::readback</text>
<rect x="80" y="520" width="1240" height="100" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="700.0" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">4. Report-last publication</text>
<text x="700.0" y="576" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Did the verified corpus reach technical READY?</text>
<text x="700.0" y="597" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111">Code: pipeline.py::_publish</text>
<line x1="700" y1="230" x2="700" y2="260" stroke="#111" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="700" y1="360" x2="700" y2="390" stroke="#111" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="700" y1="490" x2="700" y2="520" stroke="#111" stroke-width="2.2" marker-end="url(#a)"/>
<text x="700" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Not established: policy completeness • factual personhood • formal anonymity • production SLA</text>
</svg>