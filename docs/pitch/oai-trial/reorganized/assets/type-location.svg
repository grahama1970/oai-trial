<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" role="img" aria-labelledby="title desc"><title id="title">A type or location mutation is not preservation</title><desc id="desc">Authored static illustration. Not a screenshot or newly executed result. Source and qualifiers are recorded in the asset manifest.</desc><rect width="1400" height="450" fill="#0c0908" /><rect x="20" y="55" width="430" height="265" rx="10" fill="#181211" stroke="#93a289" stroke-width="2" /><text x="235.0" y="105" fill="#93a289" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="235.0" dy="0">EXPECTED</tspan></text><text x="48" y="162" fill="#ece2d3" font-size="32" font-family="Consolas, Courier New, monospace" text-anchor="start" font-weight="normal"><tspan x="48" dy="0">flag: true</tspan><tspan x="48" dy="40.32">id 1: Alice token</tspan><tspan x="48" dy="40.32">id 2: Bob token</tspan></text><rect x="490" y="55" width="430" height="265" rx="10" fill="#181211" stroke="#d1703c" stroke-width="2" /><text x="705.0" y="105" fill="#d1703c" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="705.0" dy="0">MUTATED</tspan></text><text x="520" y="162" fill="#ece2d3" font-size="32" font-family="Consolas, Courier New, monospace" text-anchor="start" font-weight="normal"><tspan x="520" dy="0">flag: 1</tspan><tspan x="520" dy="40.32">id 1: Bob token</tspan><tspan x="520" dy="40.32">id 2: Alice token</tspan></text><line x1="934" y1="181" x2="1000" y2="181" stroke="#d1703c" stroke-width="3" /><polygon points="1000,181 989.1946347717678,186.21958640933477 989.1946347717678,175.78041359066523" fill="#d1703c" /><text x="1175" y="163" fill="#d1703c" font-size="46" font-family="Fraunces, Georgia, serif" text-anchor="middle" font-weight="normal"><tspan x="1175" dy="0">REJECT</tspan></text><text x="1175" y="219" fill="#a99787" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" font-weight="normal"><tspan x="1175" dy="0">type / location</tspan></text><text x="35" y="396" fill="#a99787" font-size="28" font-family="Arial, sans-serif" text-anchor="start" font-weight="normal"><tspan x="35" dy="0">Illustrated failure cases—not newly executed mutations.</tspan></text></svg>
