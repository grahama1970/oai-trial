<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Policy-bounded runtime</title><desc id="diagram-description">Human policy declarations enter compilation, transformation, verification and publication. Broader privacy properties are not established.</desc><rect width="1400" height="720" fill="#0c0908" /><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e2ac62" /></marker></defs>
<rect x="60.0" y="150" width="220" height="180" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-0" data-component="flow-stage-0" />
<text x="170.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Human / policy</text>
<text x="170.0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Declared literals</text>
<rect x="325.0" y="150" width="220" height="180" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-1" data-component="flow-stage-1" />
<text x="435.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Compile policy</text>
<text x="435.0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Literal conflicts</text>
<rect x="590.0" y="150" width="220" height="180" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-2" data-component="flow-stage-2" />
<text x="700.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Transform</text>
<text x="700.0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Original spans</text>
<rect x="855.0" y="150" width="220" height="180" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-3" data-component="flow-stage-3" />
<text x="965.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Verify</text>
<text x="965.0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Types + locations</text>
<rect x="1120.0" y="150" width="220" height="180" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" class="oai-stage-4" data-component="flow-stage-4" />
<text x="1230.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">Publish</text>
<text x="1230.0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#ece2d3" dominant-baseline="central">report.json last</text>
<line x1="284.0" y1="240" x2="319.0" y2="240" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" class="oai-edge-0" />
<line x1="549.0" y1="240" x2="584.0" y2="240" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" class="oai-edge-1" />
<line x1="814.0" y1="240" x2="849.0" y2="240" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" class="oai-edge-2" />
<line x1="1079.0" y1="240" x2="1114.0" y2="240" stroke="#e2ac62" stroke-width="2.2" marker-end="url(#a)" class="oai-edge-3" />
<rect x="235" y="470" width="930" height="150" rx="12" fill="#181211" stroke="#e2ac62" stroke-width="2" />
<text x="700.0" y="498" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ece2d3">Not established</text>
<text x="700.0" y="526" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#ece2d3">Completeness · personhood · anonymity · linkage</text>
